
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>青空文庫ランダム</title>
</head>
<body>
  <p id="status">あなたの一冊を選んでいます……</p>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    async function randomBook() {
      try {
        const response = await fetch(
          "https://raw.githubusercontent.com/aozorabunko/aozorabunko/master/soramoyou/list_person_all_extended_utf8.zip"
        );

        if (!response.ok) throw new Error();

        const zip = await JSZip.loadAsync(
          await response.arrayBuffer()
        );

        const file = Object.values(zip.files).find(
          f => !f.dir && f.name.endsWith(".csv")
        );

        const csv = await file.async("string");

        const urls = [...new Set(
          csv.match(/https?:\/\/www\.aozora\.gr\.jp\/cards\/\d+\/card\d+\.html/g)
        )];

        if (!urls.length) throw new Error();

        const random = Math.floor(
          Math.random() * urls.length
        );

        location.replace(urls[random]);
      } catch (error) {
        document.getElementById("status").textContent =
          "作品を取得できませんでした。再読み込みしてください。";
      }
    }

    randomBook();
  </script>
</body>
</html>
