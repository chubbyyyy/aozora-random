
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>青空文庫ランダム</title>
</head>
<body>
  <p id="status">作品を選んでいます……</p>

  <script>
    async function randomBook() {
      try {
        const response = await fetch("./books.csv");

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const csv = await response.text();

        const matches = csv.match(
          /https?:\/\/[^\/,\s"]+\/cards\/\d+\/card\d+\.html/gi
        ) || [];

        const urls = [...new Set(matches.map(
          url => url.replace(/^http:/, "https:")
        ))];

        if (urls.length === 0) {
          throw new Error("作品URLが見つかりません");
        }

        const random = Math.floor(
          Math.random() * urls.length
        );

        location.replace(urls[random]);

      } catch (error) {
        document.getElementById("status").textContent =
          "エラー：" + error.message;
      }
    }

    randomBook();
  </script>
</body>
</html>
