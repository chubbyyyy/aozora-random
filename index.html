
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>青空文庫ランダム</title>
</head>
<body>
  <p id="status">作品を選んでいます……</p>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    async function randomBook() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "https://raw.githubusercontent.com/aozorabunko/aozorabunko/master/soramoyou/list_person_all_extended_utf8.zip"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const zip = await JSZip.loadAsync(
          await response.arrayBuffer()
        );

        const file = Object.values(zip.files).find(
          f => !f.dir && f.name.endsWith(".csv")
        );

        if (!file) {
          throw new Error("CSVが見つかりません");
        }

        const csv = await file.async("string");

        const matches = csv.match(
          /https?:\/\/(?:www\.)?aozora\.gr\.jp\/cards\/\d+\/card\d+\.html/gi
        ) || [];

        const urls = [...new Set(matches.map(
          url => url.replace(/^http:/, "https:")
        ))];

        if (!urls.length) {
          throw new Error("作品URLが見つかりません");
        }

        location.replace(
          urls[Math.floor(Math.random() * urls.length)]
        );

      } catch (error) {
        status.textContent = "エラー：" + error.message;
      }
    }

    randomBook();
  </script>
</body>
</html>
